      <article class="note">
<div class="note-text" data-template-slot="article-content">
          <p><strong>系统评价准则</strong>，是用以评估系统有效性、以及所要求结果与所达成结果之间符合程度的规则或标准。</p>
<p>如果能够引入定量特征，并用解析表达式把系统的目标与达成目标的手段联系起来，那么这类表达式就称为有效性准则、运行准则、目标函数等等。</p>
</div>
